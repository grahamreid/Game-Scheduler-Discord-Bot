services:
  mongo:
    image: mongo:8
    container_name: board-game-scheduler-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: boardgame
      MONGO_INITDB_ROOT_PASSWORD: boardgame-dev-password
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
